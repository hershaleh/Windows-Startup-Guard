name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Release
        run: dotnet build WindowsStartupGuard.csproj --configuration Release
      - name: Publish win-x64
        run: dotnet publish WindowsStartupGuard.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/win-x64
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Startup-Guard-win-x64
          path: artifacts/win-x64/
