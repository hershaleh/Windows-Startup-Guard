name: Publish Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download published application
        uses: actions/download-artifact@v4
        with:
          name: Windows-Startup-Guard-win-x64
          path: release-files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Package ZIP
        run: |
          cd release-files
          zip -r ../Windows-Startup-Guard-win-x64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.event.workflow_run.run_number }}
          name: Windows Startup Guard v1.0.${{ github.event.workflow_run.run_number }}
          generate_release_notes: true
          files: Windows-Startup-Guard-win-x64.zip
